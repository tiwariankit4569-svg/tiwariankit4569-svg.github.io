        /* Luxury Corporate Midnight & Gold Theme */
        :root {
            --primary-bg: #0b132b;    /* Deep Midnight Navy */
            --card-bg: #1c2541;       /* Sleek Dark Blue */
            --accent-gold: #d4af37;   /* Executive Premium Gold */
            --gold-hover: #f3e5ab;    /* Soft Light Gold */
            --text-main: #f8fafc;     /* Clean Soft White */
            --text-muted: #94a3b8;    /* Muted Slate Gray */
            --call-green: #22c55e;    /* Success Action Green */
            --email-blue: #2563eb;    /* Corporate Blue */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        /* Responsive Navigation Bar */
        header {
            background-color: rgba(11, 19, 43, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.2rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--accent-gold);
        }

        header .logo {
            font-family: 'Montserrat', sans-serif;
            color: var(--accent-gold);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        header nav a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 25px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        header nav a:hover {
            color: var(--accent-gold);
        }

        /* Hero Landing Component */
        .hero {
            padding: 8rem 8% 6rem 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4rem;
            background: radial-gradient(circle at top right, rgba(28, 37, 65, 0.8) 0%, rgba(11, 13, 43, 1) 100%);
        }

        .hero-content {
            flex: 1;
        }

        .hero-content h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3rem;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .hero-content h1 span {
            color: var(--accent-gold);
        }
        
        .hero-subtitle {
            color: var(--accent-gold);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.5px;
        }

        .hero-content p {
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            color: var(--text-muted);
        }

        /* Dedicated Typography Brand Box (Photo Alternative) */
        .hero-image-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-logo-box {
            width: 300px;
            height: 300px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--card-bg) 0%, #0f172a 100%);
            border: 3px dashed var(--accent-gold);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.2);
            transition: transform 0.3s ease;
        }

        .brand-logo-box:hover {
            transform: scale(1.02);
            border-style: solid;
        }

        .brand-logo-box .logo-icon {
            font-size: 3.5rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        .brand-logo-box h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .brand-logo-box p {
            color: var(--accent-gold);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* Direct Action Channel Buttons */
        .btn-group {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .btn {
            color: #0b132b;
            padding: 0.85rem 2rem;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-call {
            background: linear-gradient(135deg, var(--call-green) 0%, #16a34a 100%);
            color: white;
        }

        .btn-call:hover {
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }

        .btn-email {
            background: linear-gradient(135deg, var(--accent-gold) 0%, #aa841c 100%);
            color: #0b132b;
        }

        .btn-email:hover {
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        /* Main Structural Containers */
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 5rem 2rem;
        }

        .section-title {
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 4rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .section-title span {
            color: var(--accent-gold);
        }

        /* Detailed Profile Information Cards */
        .about-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 4rem 3.5rem;
            border: 1px solid rgba(212, 175, 55, 0.12);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .lang-section {
            margin-bottom: 4rem;
        }

        .lang-section:last-child {
            margin-bottom: 0;
        }

        .lang-badge {
            background-color: rgba(212, 175, 55, 0.15);
            color: var(--accent-gold);
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 1.5rem;
            font-family: 'Montserrat', sans-serif;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }

        .about-box p {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            text-align: justify;
        }

        .about-box strong {
            color: var(--accent-gold);
        }
        
        .about-box ul {
            list-style: none;
            margin-left: 5px;
            margin-bottom: 2rem;
        }

        .about-box ul li {
            position: relative;
            padding-left: 30px;
            margin-bottom: 1rem;
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .about-box ul li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Professional Expertise Cards Grid Layout */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        .service-card {
            background-color: var(--card-bg);
            padding: 3rem 2.5rem;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: all 0.3s ease;
        }

        .service-card:hover {
            transform: translateY(-8px);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }

        .service-card h3 {
            font-size: 1.35rem;
            margin-bottom: 1.2rem;
            color: var(--accent-gold);
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
        }

        .service-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            text-align: justify;
        }

        /* Contact Operations Section */
        .contact-info {
            background: linear-gradient(135deg, var(--card-bg) 0%, #111a36 100%);
            padding: 4.5rem 2rem;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            text-align: center;
            max-width: 750px;
            margin: 0 auto;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
        }

        .contact-info p {
            margin-bottom: 2.5rem;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .contact-channels {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
